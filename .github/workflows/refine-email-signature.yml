name: Refine Taqa Misr email signature

on:
  push:
    paths:
      - '.github/workflows/refine-email-signature.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build official icon assets and patch signature
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          import re
          from PIL import Image, ImageChops
          import cairosvg

          root = Path('email-signature')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'

          def fetch(url):
              req = Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urlopen(req, timeout=30) as r:
                  return r.read()

          def favicon_to_png(name, url):
              data = fetch(url)
              image = Image.open(BytesIO(data))
              best = None
              n = getattr(image, 'n_frames', 1)
              for i in range(n):
                  try:
                      image.seek(i)
                  except EOFError:
                      break
                  frame = image.convert('RGBA').copy()
                  if best is None or frame.width * frame.height > best.width * best.height:
                      best = frame
              if best is None:
                  raise RuntimeError(f'No image frame for {name}')
              side = max(best.size)
              canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
              canvas.alpha_composite(best, ((side - best.width)//2, (side - best.height)//2))
              canvas = canvas.resize((64, 64), Image.Resampling.LANCZOS)
              canvas.save(assets / f'{name}.png', optimize=True)
              print(f'official {name}: {url} -> {best.size}')

          official_icons = {
              'facebook': 'https://www.facebook.com/favicon.ico',
              'instagram': 'https://www.instagram.com/favicon.ico',
              'youtube': 'https://www.youtube.com/favicon.ico',
              'linkedin': 'https://www.linkedin.com/favicon.ico',
              'whatsapp': 'https://www.whatsapp.com/favicon.ico',
          }
          for name, url in official_icons.items():
              favicon_to_png(name, url)

          # Clean phone handset icon. This is not a brand mark; it only indicates a normal phone call.
          phone_svg = fetch('https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/solid/phone.svg')
          cairosvg.svg2png(bytestring=phone_svg, write_to=str(assets / 'phone.png'), output_width=64, output_height=64)

          # Use TAQA Misr's current official website logo and crop the outer whitespace.
          logo_data = fetch('https://taqamisr.com/wp-content/uploads/2025/02/logo-300x60.png')
          logo = Image.open(BytesIO(logo_data)).convert('RGBA')
          bg = Image.new('RGBA', logo.size, (255, 255, 255, 255))
          diff = ImageChops.difference(logo, bg).convert('L')
          diff = diff.point(lambda p: 255 if p > 12 else 0)
          bbox = diff.getbbox() or logo.getbbox()
          if bbox:
              l, t, r, b = bbox
              pad = 1
              bbox = (max(0, l-pad), max(0, t-pad), min(logo.width, r+pad), min(logo.height, b+pad))
              logo = logo.crop(bbox)
          logo.save(assets / 'taqa-logo.png', optimize=True)
          print('TAQA logo cropped to', logo.size)

          path = root / 'index.html'
          text = path.read_text(encoding='utf-8')

          # Replace the logo image with a tightly cropped, hosted image. No transparent offset before the name.
          text, count = re.subn(
              r'<img id="taqaLogo" src="data:image/png;base64,[^"]+" width="250" height="82" alt="Taqa Misr" style="[^"]+">',
              '<img id="taqaLogo" src="https://saiaf25.github.io/taqa/email-signature/assets/taqa-logo.png" width="230" alt="Taqa Misr" style="display:block;width:230px;height:auto;margin:0;padding:0;border:0;outline:none;text-decoration:none;">',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected one TAQA logo replacement, got {count}')

          # Make the logo row visually align at the exact same left edge as the name below.
          text = text.replace(
              '<td colspan="2" style="padding:0 0 8px 0;vertical-align:top;">\n                  <a href="https://taqamisr.com/" target="_blank" style="text-decoration:none;border:0;">',
              '<td colspan="2" style="padding:0 0 7px 0;vertical-align:top;text-align:left;">\n                  <a href="https://taqamisr.com/" target="_blank" style="display:block;width:230px;text-decoration:none;border:0;margin:0;padding:0;">',
              1
          )

          old_mobile = '''              <tr>
                <td style="width:54px;padding:0 7px 8px 0;vertical-align:middle;white-space:nowrap;">
                  <a id="outWhatsAppLink" href="https://wa.me/201012345678" target="_blank" title="WhatsApp" style="display:inline-block;margin:0 5px 0 0;text-decoration:none;border:0;vertical-align:middle;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/whatsapp.png" width="20" height="20" alt="WhatsApp" style="display:block;width:20px;height:20px;border:0;outline:none;"></a>
                  <a id="outMobileIconLink" href="tel:+201012345678" title="Mobile" style="display:inline-block;text-decoration:none;border:0;vertical-align:middle;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/mobile.png" width="20" height="20" alt="Mobile" style="display:block;width:20px;height:20px;border:0;outline:none;"></a>
                </td>
                <td style="padding:0 0 8px 0;vertical-align:middle;">
                  <a id="outMobileLink" href="tel:+201012345678" style="color:#003ca6;text-decoration:none;"><span id="outMobile">(+20) 10 1234 5678</span></a>
                </td>
              </tr>'''

          new_mobile = '''              <tr>
                <td colspan="2" style="padding:0 0 8px 0;vertical-align:middle;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td style="padding:0 6px 0 0;vertical-align:middle;">
                        <a id="outWhatsAppLink" href="https://wa.me/201012345678" target="_blank" title="WhatsApp" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/whatsapp.png" width="20" height="20" alt="WhatsApp" style="display:block;width:20px;height:20px;border:0;outline:none;text-decoration:none;"></a>
                      </td>
                      <td style="padding:0 7px 0 0;vertical-align:middle;">
                        <a id="outMobileIconLink" href="tel:+201012345678" title="Call" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/phone.png" width="18" height="18" alt="Call" style="display:block;width:18px;height:18px;border:0;outline:none;text-decoration:none;"></a>
                      </td>
                      <td style="padding:0;vertical-align:middle;white-space:nowrap;">
                        <a id="outMobileLink" href="tel:+201012345678" style="color:#003ca6;text-decoration:none;"><span id="outMobile">(+20) 10 1234 5678</span></a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>'''
          if old_mobile not in text:
              raise SystemExit('Current personal mobile row was not found')
          text = text.replace(old_mobile, new_mobile, 1)

          old_social = '''              <tr>
                <td colspan="2" style="padding:0 0 7px 0;white-space:nowrap;">
                  <a href="https://facebook.com/taqamisr" target="_blank" title="Facebook" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/facebook.png" width="22" height="22" alt="Facebook" style="display:block;width:22px;height:22px;border:0;outline:none;"></a>
                  <a href="https://instagram.com/taqamisr" target="_blank" title="Instagram" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/instagram.png" width="22" height="22" alt="Instagram" style="display:block;width:22px;height:22px;border:0;outline:none;"></a>
                  <a href="https://www.youtube.com/taqamisr" target="_blank" title="YouTube" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/youtube.png" width="22" height="22" alt="YouTube" style="display:block;width:22px;height:22px;border:0;outline:none;"></a>
                  <a href="https://www.linkedin.com/company/taqamisr" target="_blank" title="LinkedIn" style="display:inline-block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/linkedin.png" width="22" height="22" alt="LinkedIn" style="display:block;width:22px;height:22px;border:0;outline:none;"></a>
                </td>
              </tr>'''

          new_social = '''              <tr>
                <td colspan="2" style="padding:0 0 8px 0;vertical-align:middle;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td style="padding:0 8px 0 0;"><a href="https://facebook.com/taqamisr" target="_blank" title="Facebook" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/facebook.png" width="24" height="24" alt="Facebook" style="display:block;width:24px;height:24px;border:0;outline:none;text-decoration:none;"></a></td>
                      <td style="padding:0 8px 0 0;"><a href="https://instagram.com/taqamisr" target="_blank" title="Instagram" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/instagram.png" width="24" height="24" alt="Instagram" style="display:block;width:24px;height:24px;border:0;outline:none;text-decoration:none;"></a></td>
                      <td style="padding:0 8px 0 0;"><a href="https://www.youtube.com/taqamisr" target="_blank" title="YouTube" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/youtube.png" width="24" height="24" alt="YouTube" style="display:block;width:24px;height:24px;border:0;outline:none;text-decoration:none;"></a></td>
                      <td style="padding:0;"><a href="https://www.linkedin.com/company/taqamisr" target="_blank" title="LinkedIn" style="display:block;text-decoration:none;border:0;"><img src="https://saiaf25.github.io/taqa/email-signature/assets/linkedin.png" width="24" height="24" alt="LinkedIn" style="display:block;width:24px;height:24px;border:0;outline:none;text-decoration:none;"></a></td>
                    </tr>
                  </table>
                </td>
              </tr>'''
          if old_social not in text:
              raise SystemExit('Current social icon row was not found')
          text = text.replace(old_social, new_social, 1)

          start = text.index('      async function copySignature() {')
          end = text.index('\n\n      Object.values(fields)', start)
          new_copy = '''      async function copySignature() {
        updatePreview();
        const signature = document.getElementById('signature');
        let copied = false;

        if (navigator.clipboard && window.ClipboardItem) {
          try {
            const htmlBlob = new Blob([signature.innerHTML], { type: 'text/html' });
            const textBlob = new Blob([signature.innerText], { type: 'text/plain' });
            await navigator.clipboard.write([
              new ClipboardItem({
                'text/html': htmlBlob,
                'text/plain': textBlob
              })
            ]);
            copied = true;
          } catch (_) {
            copied = false;
          }
        }

        if (!copied) {
          const range = document.createRange();
          range.selectNodeContents(signature);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          try {
            copied = document.execCommand('copy');
          } catch (_) {
            copied = false;
          }
          selection.removeAllRanges();
        }

        if (copied) {
          result.textContent = 'تم نسخ التوقيع بصيغة HTML مع الصور والروابط. الصقه مباشرة داخل مربع التوقيع في Zoho.';
          result.className = 'copy-result ok';
        } else {
          result.textContent = 'لم يسمح المتصفح بالنسخ التلقائي. حدّد التوقيع داخل المعاينة ثم اضغط ⌘C أو Ctrl+C.';
          result.className = 'copy-result error';
        }
      }'''
          text = text[:start] + new_copy + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit refined signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-signature/index.html email-signature/assets
          git diff --cached --quiet && exit 0
          git commit -m "Refine email signature logos alignment and Zoho copy"
          git push origin main
