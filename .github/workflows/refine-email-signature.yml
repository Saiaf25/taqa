name: Refine Taqa Misr email signature

on:
  push:
    paths:
      - '.github/workflows/refine-email-signature.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: python3 -m pip install --quiet pillow cairosvg
      - name: Apply signature refinement
        run: |
          sed -i "s#https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/linkedin.svg#https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.x/svgs/brands/linkedin-in.svg#" .github/refine_email_signature.py
          python3 .github/refine_email_signature.py
      - name: Commit refined signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-signature/index.html email-signature/assets
          git diff --cached --quiet && exit 0
          git commit -m "Refine email signature logos alignment and Zoho copy"
          git push origin main
