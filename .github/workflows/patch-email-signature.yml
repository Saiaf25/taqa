name: Patch email signature icons

on:
  push:
    paths:
      - '.github/workflows/patch-email-signature.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update email signature
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('email-signature/index.html')
          text = path.read_text(encoding='utf-8')

          facebook = ''
          instagram = ''
          youtube = ''
          linkedin = ''
          whatsapp = ''
          mobile = 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAAlElEQVR42u2YwRGAIAwEgaFJe7Ace6BM/TqOH02OwLD7J2Th8klKAGuTTae343TrpO25n4Bn40aRMnuEylCv/6N+jcqu16PUyMtjIjT9DAzG9DNAhBBAAAEEEEAAAQQQQAABBBBAAAEE1hSo0ur3hZXHAqzrDzy3baIlMDMQTTZHQ8GHeSnK4urmF42QKk7qnwV45wLDJiEbVNlaRwAAAABJRU5ErkJggg=='

          old_mobile = '''              <tr>
                <td style="width:22px;padding:0 5px 8px 0;vertical-align:top;color:#20a464;font-size:16px;">●</td>
                <td style="padding:0 0 8px 0;vertical-align:top;">
                  <a id="outMobileLink" href="tel:+201012345678" style="color:#003ca6;text-decoration:none;"><span id="outMobile">(+20) 10 1234 5678</span></a>
                </td>
              </tr>'''

          new_mobile = f'''              <tr>
                <td style="width:54px;padding:0 7px 8px 0;vertical-align:middle;white-space:nowrap;">
                  <a id="outWhatsAppLink" href="https://wa.me/201012345678" target="_blank" style="display:inline-block;margin:0 5px 0 0;text-decoration:none;border:0;vertical-align:middle;"><img src="data:image/png;base64,{whatsapp}" width="20" height="20" alt="WhatsApp" style="display:block;width:20px;height:20px;border:0;"></a>
                  <a id="outMobileIconLink" href="tel:+201012345678" style="display:inline-block;text-decoration:none;border:0;vertical-align:middle;"><img src="data:image/png;base64,{mobile}" width="20" height="20" alt="Mobile" style="display:block;width:20px;height:20px;border:0;"></a>
                </td>
                <td style="padding:0 0 8px 0;vertical-align:middle;">
                  <a id="outMobileLink" href="tel:+201012345678" style="color:#003ca6;text-decoration:none;"><span id="outMobile">(+20) 10 1234 5678</span></a>
                </td>
              </tr>'''

          old_phone = '''              <tr>
                <td colspan="2" style="padding:0;">Phone: <a href="tel:+20222614715" style="color:#003ca6;text-decoration:none;">(+20) 2 2261 4715</a></td>
              </tr>
'''

          old_social = '''              <tr>
                <td colspan="2" style="padding:0 0 5px 0;white-space:nowrap;">
                  <a href="https://facebook.com/taqamisr" style="display:inline-block;margin:0 5px 0 0;padding:2px 6px;background:#005994;color:#ffffff;text-decoration:none;font-size:11px;font-weight:bold;">Facebook</a>
                  <a href="https://instagram.com/taqamisr" style="display:inline-block;margin:0 5px 0 0;padding:2px 6px;background:#005994;color:#ffffff;text-decoration:none;font-size:11px;font-weight:bold;">Instagram</a>
                  <a href="https://www.youtube.com/taqamisr" style="display:inline-block;margin:0 5px 0 0;padding:2px 6px;background:#005994;color:#ffffff;text-decoration:none;font-size:11px;font-weight:bold;">YouTube</a>
                  <a href="https://www.linkedin.com/company/taqamisr" style="display:inline-block;margin:0;padding:2px 6px;background:#005994;color:#ffffff;text-decoration:none;font-size:11px;font-weight:bold;">LinkedIn</a>
                </td>
              </tr>'''

          new_social = f'''              <tr>
                <td colspan="2" style="padding:0 0 7px 0;white-space:nowrap;">
                  <a href="https://facebook.com/taqamisr" target="_blank" title="Facebook" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="data:image/png;base64,{facebook}" width="22" height="22" alt="Facebook" style="display:block;width:22px;height:22px;border:0;"></a>
                  <a href="https://instagram.com/taqamisr" target="_blank" title="Instagram" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="data:image/png;base64,{instagram}" width="22" height="22" alt="Instagram" style="display:block;width:22px;height:22px;border:0;"></a>
                  <a href="https://www.youtube.com/taqamisr" target="_blank" title="YouTube" style="display:inline-block;margin:0 7px 0 0;text-decoration:none;border:0;"><img src="data:image/png;base64,{youtube}" width="22" height="22" alt="YouTube" style="display:block;width:22px;height:22px;border:0;"></a>
                  <a href="https://www.linkedin.com/company/taqamisr" target="_blank" title="LinkedIn" style="display:inline-block;text-decoration:none;border:0;"><img src="data:image/png;base64,{linkedin}" width="22" height="22" alt="LinkedIn" style="display:block;width:22px;height:22px;border:0;"></a>
                </td>
              </tr>'''

          old_js = '''        document.getElementById('outMobile').textContent = mobile;
        document.getElementById('outMobileLink').href = `tel:${phoneDigits}`;
        document.getElementById('outEmail').textContent = email;'''

          new_js = '''        document.getElementById('outMobile').textContent = mobile;
        document.getElementById('outMobileLink').href = `tel:${phoneDigits}`;
        document.getElementById('outMobileIconLink').href = `tel:${phoneDigits}`;
        document.getElementById('outWhatsAppLink').href = `https://wa.me/${phoneDigits.replace(/^\\+/, '')}`;
        document.getElementById('outEmail').textContent = email;'''

          replacements = [
              (old_mobile, new_mobile, 'personal mobile row'),
              (old_phone, '', '4715 phone row'),
              (old_social, new_social, 'social icons row'),
              (old_js, new_js, 'dynamic phone links'),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Could not find expected {label}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-signature/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update email signature contact and social icons"
          git push origin main
