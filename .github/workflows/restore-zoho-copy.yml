name: Restore proven Zoho signature copy

on:
  push:
    paths:
      - '.github/workflows/restore-zoho-copy.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore embedded images and original copy method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          root = Path('email-signature')
          path = root / 'index.html'
          html = path.read_text(encoding='utf-8')

          # Embed every signature image exactly the way the original Zoho-working version did.
          assets = {
              'taqa-logo-20260812-2021.png': 'image/png',
              'facebook.png': 'image/png',
              'instagram.png': 'image/png',
              'youtube.png': 'image/png',
              'linkedin.png': 'image/png',
              'whatsapp.png': 'image/png',
              'phone.png': 'image/png',
          }
          for filename, mime in assets.items():
              data = (root / 'assets' / filename).read_bytes()
              uri = f'data:{mime};base64,' + base64.b64encode(data).decode('ascii')
              hosted = f'https://saiaf25.github.io/taqa/email-signature/assets/{filename}'
              if hosted not in html:
                  raise SystemExit(f'Expected hosted asset URL not found: {hosted}')
              html = html.replace(hosted, uri)

          # Restore the exact selection + execCommand approach from the original working version.
          start = html.index('      async function copySignature() {')
          end = html.index('      Object.values(fields).forEach', start)
          original_copy = '''      async function copySignature() {
        updatePreview();
        const signature = document.getElementById('signature');
        const range = document.createRange();
        range.selectNodeContents(signature);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (_) {
          copied = false;
        }
        selection.removeAllRanges();

        if (copied) {
          result.textContent = 'تم نسخ التوقيع. افتح Zoho والصقه داخل مربع التوقيع.';
          result.className = 'copy-result ok';
        } else {
          result.textContent = 'لم يسمح المتصفح بالنسخ التلقائي. حدّد التوقيع داخل المعاينة ثم اضغط ⌘C أو Ctrl+C.';
          result.className = 'copy-result error';
        }
      }

'''
          html = html[:start] + original_copy + html[end:]

          # Guardrails: no signature image may remain dependent on GitHub Pages hosting.
          signature_start = html.index('<div id="signature"')
          signature_end = html.index('</div>', signature_start)
          sig = html[signature_start:signature_end]
          if 'https://saiaf25.github.io/taqa/email-signature/assets/' in sig:
              raise SystemExit('A hosted signature asset remains')
          if 'navigator.clipboard' in html or 'ClipboardItem' in html:
              raise SystemExit('Modern clipboard path still present')
          if html.count('data:image/png;base64,') < 7:
              raise SystemExit('Expected all seven embedded PNG images')

          path.write_text(html, encoding='utf-8')
          print('Restored original Zoho copy method and embedded all 7 images as base64 data URIs.')
          PY

      - name: Commit Zoho-compatible signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-signature/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore proven Zoho image copy technique"
          git push origin main
