name: Bust email signature cache

on:
  push:
    paths:
      - '.github/workflows/bust-signature-cache.yml'

permissions:
  contents: write

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Version logo URL
        run: |
          cp email-signature/assets/taqa-logo.png email-signature/assets/taqa-logo-20260812-2021.png
          sed -i 's#email-signature/assets/taqa-logo.png#email-signature/assets/taqa-logo-20260812-2021.png#g' email-signature/index.html

      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-signature/index.html email-signature/assets/taqa-logo-20260812-2021.png
          git diff --cached --quiet && exit 0
          git commit -m "Hard-bust email signature logo cache"
          git push origin main
